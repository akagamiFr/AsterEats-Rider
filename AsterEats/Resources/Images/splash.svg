<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

	<!-- Burger -->
	<path d="M22 46
           V41
           C22 34 31 30 40 30
           H64
           C73 30 82 34 82 41
           V46
           Z"
		  fill="#FFFFFF"/>

	<!-- Sesame seeds -->
	<g fill="#36ABAD">
		<ellipse cx="35" cy="39" rx="2.2" ry="1.2"/>
		<ellipse cx="46" cy="35" rx="2.2" ry="1.2"/>
		<ellipse cx="58" cy="35" rx="2.2" ry="1.2"/>
		<ellipse cx="69" cy="39" rx="2.2" ry="1.2"/>
		<ellipse cx="52" cy="41" rx="2.2" ry="1.2"/>
	</g>

	<!-- Burger filling -->
	<path d="M22 47
           H82
           V51
           C76 56 70 56 64 51
           C58 56 52 56 46 51
           C40 56 34 56 28 51
           C26 53 24 53 22 52
           Z"
		  fill="#FFFFFF"/>

	<!-- Patty -->
	<rect x="24"
		  y="57"
		  width="56"
		  height="13"
		  rx="4"
		  fill="#FFFFFF"/>

	<!-- Bottom bun -->
	<path d="M24 72
           H80
           V85
           C80 91 74 94 64 94
           H40
           C30 94 24 91 24 85
           Z"
		  fill="#FFFFFF"/>

	<!-- Burger separator details -->
	<rect x="24" y="46" width="58" height="2" fill="#36ABAD"/>
	<rect x="24" y="55" width="56" height="2" fill="#36ABAD"/>
	<rect x="24" y="70" width="56" height="2" fill="#36ABAD"/>


	<!-- Fork -->
	<g fill="#FFFFFF">

		<!-- Four straight prongs -->
		<rect x="88" y="30" width="3" height="20" rx="1.5"/>
		<rect x="93" y="30" width="3" height="20" rx="1.5"/>
		<rect x="98" y="30" width="3" height="20" rx="1.5"/>
		<rect x="103" y="30" width="3" height="20" rx="1.5"/>

		<!-- Fork head / shoulder -->
		<rect x="88" y="47" width="18" height="6" rx="2"/>

		<!-- Straight neck -->
		<rect x="94" y="51" width="6" height="12"/>

		<!-- Handle -->
		<rect x="93" y="61" width="8" height="34" rx="4"/>

	</g>

</svg>